<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Elven — Staff Access</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%232B211E'/%3E%3Ctext x='50' y='64' font-size='54' text-anchor='middle' font-family='Georgia,serif' fill='%23FBF1EC'%3EE%3C/text%3E%3C/svg%3E">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --ink:    #2B211E;
    --bg:     #FBF1EC;
    --gold:   #C9A87C;
    --err:    #C0392B;
  }

  body {
    font-family: 'Montserrat', sans-serif;
    background: var(--ink);
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse at 20% 60%, rgba(201,168,124,.12) 0%, transparent 60%),
      radial-gradient(ellipse at 80% 30%, rgba(243,217,212,.08) 0%, transparent 60%);
    pointer-events: none;
  }

  .login-wrap {
    width: 100%;
    max-width: 440px;
    padding: 20px;
    animation: fadeUp .6s ease both;
  }

  @keyframes fadeUp {
    from { opacity:0; transform: translateY(24px); }
    to   { opacity:1; transform: translateY(0); }
  }

  .login-card {
    background: rgba(251,241,236,.04);
    border: 1px solid rgba(251,241,236,.10);
    border-radius: 16px;
    padding: 48px 40px 44px;
    backdrop-filter: blur(12px);
  }

  .login-mark {
    font-family: 'Playfair Display', Georgia, serif;
    color: #FBF1EC;
    font-size: 28px;
    letter-spacing: .12em;
    text-align: center;
    margin-bottom: 6px;
  }
  .login-sub {
    text-align: center;
    color: rgba(251,241,236,.4);
    font-size: 12px;
    letter-spacing: .1em;
    text-transform: uppercase;
    margin-bottom: 36px;
  }

  .lock-icon {
    display: flex;
    justify-content: center;
    margin-bottom: 32px;
  }
  .lock-icon svg {
    width: 38px; height: 38px;
    stroke: rgba(201,168,124,.7);
    fill: none;
    stroke-width: 1.4;
  }

  .field-wrap { margin-bottom: 16px; }
  label {
    display: block;
    font-size: 10.5px;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: rgba(251,241,236,.45);
    margin-bottom: 8px;
  }
  input {
    width: 100%;
    background: rgba(251,241,236,.06);
    border: 1px solid rgba(251,241,236,.12);
    border-radius: 8px;
    padding: 14px 16px;
    color: #FBF1EC;
    font-family: 'Montserrat', sans-serif;
    font-size: 15px;
    letter-spacing: .04em;
    outline: none;
    transition: border-color .2s, background .2s;
  }
  input:focus {
    border-color: rgba(201,168,124,.7);
    background: rgba(201,168,124,.06);
  }
  input::placeholder { color: rgba(251,241,236,.2); }

  .error-msg {
    font-size: 12.5px;
    color: #e07070;
    text-align: center;
    min-height: 20px;
    margin: 12px 0 16px;
    display: none;
  }
  .error-msg.show { display: block; animation: shake .3s ease; }
  @keyframes shake {
    0%,100%{ transform: translateX(0); }
    25%    { transform: translateX(-7px); }
    75%    { transform: translateX(7px); }
  }

  .btn-login {
    width: 100%;
    background: var(--gold);
    color: var(--ink);
    border: none;
    border-radius: 8px;
    padding: 15px;
    font-family: 'Montserrat', sans-serif;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: .12em;
    text-transform: uppercase;
    cursor: pointer;
    margin-top: 4px;
    transition: opacity .2s, transform .15s;
  }
  .btn-login:hover  { opacity: .88; }
  .btn-login:active { transform: scale(.98); }

  .login-foot {
    text-align: center;
    margin-top: 30px;
    font-size: 11.5px;
    color: rgba(251,241,236,.18);
    letter-spacing: .04em;
  }
</style>
</head>
<body>
  <div class="login-wrap">
    <div class="login-card">
      <div class="login-mark">ELVEN</div>
      <div class="login-sub">Staff Portal</div>

      <div class="lock-icon">
        <svg viewBox="0 0 24 24">
          <rect x="3" y="11" width="18" height="11" rx="2"/>
          <path d="M7 11V7a5 5 0 0110 0v4"/>
        </svg>
      </div>

      <form id="loginForm" autocomplete="off">
        <div class="field-wrap" id="unameWrap" style="display:none">
          <label for="uname">Username</label>
          <input id="uname" type="text" autocomplete="username">
        </div>
        <div class="field-wrap">
          <label for="pwd">Password</label>
          <input id="pwd" type="password" placeholder="Enter your staff password" autofocus autocomplete="current-password">
        </div>
        <div class="error-msg" id="errMsg">Incorrect username or password.</div>
        <button type="submit" class="btn-login">Enter Admin Panel</button>
      </form>

      <div class="login-foot">Elven internal — not publicly accessible</div>
    </div>
  </div>

<script>
  /* ================================================================
     ELVEN ADMIN CREDENTIALS
     ---------------------------------------------------------------
     To add admins or change passwords, edit this array below.
     Format: { user: 'username', pass: 'password' }
     
     Also update admin-credentials.txt to keep your reference copy.
     ================================================================ */
  const ELVEN_ADMINS = [
    { user: 'admin1',     pass: 'elven@123'        },
    { user: 'manager',    pass: 'elvenShop2026'    },
    { user: 'superadmin', pass: 'Elven#Master99'   },
  ];

  // Ensure they accessed via the secret URL extension
  const pathUser = window.location.pathname.replace('/', '').trim();
  const isValidUser = ELVEN_ADMINS.some(a => a.user === pathUser);

  if (!isValidUser && window.location.pathname !== '/shop-admin.html') {
    window.location.replace('/'); // Redirect to home if it's an invalid path
  } else if (isValidUser) {
    document.getElementById('uname').value = pathUser;
  }

  // If already authenticated, skip to admin
  if(sessionStorage.getItem('elven_admin_auth') === 'granted'){
    window.location.replace('admin.html');
  }

  document.getElementById('loginForm').addEventListener('submit', function(e){
    e.preventDefault();
    const uname = document.getElementById('uname').value.trim();
    const pwd   = document.getElementById('pwd').value;
    const err   = document.getElementById('errMsg');

    const match = ELVEN_ADMINS.find(a => a.user === uname && a.pass === pwd);

    if(match){
      sessionStorage.setItem('elven_admin_auth', 'granted');
      sessionStorage.setItem('elven_admin_user', uname);
      window.location.replace('admin.html');
    } else {
      err.classList.remove('show');
      void err.offsetWidth;
      err.classList.add('show');
      document.getElementById('pwd').value = '';
      document.getElementById('pwd').focus();
    }
  });
</script>
</body>
</html>
