<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Elven — Sign In</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<style>
  body {
    background: var(--cream-2);
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .auth-box {
    background: var(--white);
    padding: 50px 40px;
    border-radius: 4px;
    width: 100%;
    max-width: 420px;
    box-shadow: 0 20px 60px rgba(43,33,30,.08);
    text-align: center;
  }
  .auth-mark {
    font-family: var(--display);
    font-size: 32px;
    letter-spacing: .12em;
    color: var(--ink);
    margin-bottom: 30px;
  }
  .auth-tabs {
    display: flex;
    margin-bottom: 24px;
    border-bottom: 1px solid rgba(43,33,30,.1);
  }
  .auth-tab {
    flex: 1;
    padding: 12px 0;
    font-size: 13px;
    letter-spacing: .08em;
    color: var(--ink-45);
    cursor: pointer;
    border-bottom: 2px solid transparent;
    transition: all .2s;
  }
  .auth-tab.active {
    color: var(--ink);
    border-bottom-color: var(--ink);
  }
  .auth-form { display: none; text-align: left; }
  .auth-form.active { display: block; }
  .auth-field {
    display: flex; flex-direction: column; gap: 6px; margin-bottom: 18px;
  }
  .auth-field label {
    font-size: 11px; letter-spacing: .1em; color: var(--ink-70); text-transform: uppercase;
  }
  .auth-field input {
    border: 1px solid rgba(43,33,30,.15);
    padding: 14px 16px;
    font-family: var(--body);
    font-size: 14px;
    border-radius: 2px;
    outline: none;
    transition: border-color .2s;
  }
  .auth-field input:focus { border-color: var(--rose-2); }
  .auth-btn {
    width: 100%; background: var(--ink); color: var(--white);
    border: none; padding: 16px; margin-top: 10px;
    font-family: var(--body); font-size: 13px; letter-spacing: .1em;
    cursor: pointer; transition: opacity .2s; border-radius: 2px;
  }
  .auth-btn:hover { opacity: .85; }
  .auth-error {
    color: var(--rose-2); font-size: 13px; margin-top: 16px; display: none;
  }
  .profile-view { display: none; text-align: left; }
  .profile-view.active { display: block; }
  .profile-name { font-family: var(--display); font-size: 28px; margin-bottom: 6px; }
  .profile-email { font-size: 14px; color: var(--ink-70); margin-bottom: 30px; }
  .btn-outline {
    background: transparent; border: 1px solid var(--ink); color: var(--ink);
  }
  .btn-outline:hover { background: var(--ink); color: var(--white); }
  .back-link {
    display: inline-block; margin-top: 24px; font-size: 12px; color: var(--ink-70);
    text-decoration: underline;
  }
</style>
</head>
<body>

<div class="auth-box">
  <div class="auth-mark">ELVEN</div>
  
  <div id="unauthView">
    <div class="auth-tabs">
      <div class="auth-tab active" onclick="switchTab('login')">SIGN IN</div>
      <div class="auth-tab" onclick="switchTab('register')">REGISTER</div>
    </div>
    
    <form id="loginForm" class="auth-form active" onsubmit="handleAuth(event, 'login')">
      <div class="auth-field">
        <label>Email Address</label>
        <input type="email" name="email" required>
      </div>
      <div class="auth-field">
        <label>Password</label>
        <input type="password" name="password" required>
      </div>
      <button type="submit" class="auth-btn">SIGN IN</button>
      <div id="loginError" class="auth-error"></div>
    </form>
    
    <form id="registerForm" class="auth-form" onsubmit="handleAuth(event, 'register')">
      <div class="auth-field">
        <label>Full Name</label>
        <input type="text" name="name" required>
      </div>
      <div class="auth-field">
        <label>Email Address</label>
        <input type="email" name="email" required>
      </div>
      <div class="auth-field">
        <label>Password</label>
        <input type="password" name="password" required>
      </div>
      <button type="submit" class="auth-btn">CREATE ACCOUNT</button>
      <div id="registerError" class="auth-error"></div>
    </form>
  </div>

  <div id="authView" class="profile-view">
    <div class="profile-name" id="pName"></div>
    <div class="profile-email" id="pEmail"></div>
    <button class="auth-btn btn-outline" onclick="logout()">SIGN OUT</button>
  </div>
  
  <a href="index.html" class="back-link">Return to Store</a>
</div>

<script>
  function switchTab(tab) {
    document.querySelectorAll('.auth-tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.auth-form').forEach(f => f.classList.remove('active'));
    
    if (tab === 'login') {
      document.querySelectorAll('.auth-tab')[0].classList.add('active');
      document.getElementById('loginForm').classList.add('active');
    } else {
      document.querySelectorAll('.auth-tab')[1].classList.add('active');
      document.getElementById('registerForm').classList.add('active');
    }
  }

  async function handleAuth(e, type) {
    e.preventDefault();
    const form = e.target;
    const btn = form.querySelector('button');
    const err = document.getElementById(type + 'Error');
    const formData = new FormData(form);
    const data = Object.fromEntries(formData.entries());
    
    btn.textContent = 'PLEASE WAIT...';
    err.style.display = 'none';
    
    try {
      const res = await fetch(`/api/auth/${type}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data)
      });
      const json = await res.json();
      
      if (res.ok && json.token) {
        localStorage.setItem('elven_token', json.token);
        window.location.href = 'index.html';
      } else {
        err.textContent = json.error || 'Authentication failed';
        err.style.display = 'block';
      }
    } catch(errObj) {
      err.textContent = 'Network error. Is the server running?';
      err.style.display = 'block';
    }
    btn.textContent = type === 'login' ? 'SIGN IN' : 'CREATE ACCOUNT';
  }

  function logout() {
    localStorage.removeItem('elven_token');
    window.location.reload();
  }

  async function checkAuth() {
    const token = localStorage.getItem('elven_token');
    if (token) {
      try {
        const res = await fetch('/api/user', {
          headers: { 'Authorization': 'Bearer ' + token }
        });
        if (res.ok) {
          const user = await res.json();
          document.getElementById('unauthView').style.display = 'none';
          document.getElementById('authView').classList.add('active');
          document.getElementById('pName').textContent = user.name;
          document.getElementById('pEmail').textContent = user.email;
        }
      } catch(e) {}
    }
  }
  
  checkAuth();
</script>
</body>
</html>
